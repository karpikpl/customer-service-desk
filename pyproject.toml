[project]
name = "customer-service-desk"
version = "0.1.0"
description = "Identity-scoped ServiceNow assistant for Foundry Activity Protocol and Teams"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-ai-agentserver-activity==1.0.0b4",
    "azure-identity>=1.25,<2",
    "azure-keyvault-secrets>=4.10,<5",
    "azure-monitor-opentelemetry-exporter>=1.0.0b58,<2",
    "github-copilot-sdk==1.0.24",
    "httpx>=0.28,<1",
    "mcp>=1.26,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "jsonschema>=4.25,<5",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_desk"]

[project.scripts]
service-desk = "service_desk.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["snow_integration: explicit opt-in read-only tests against configured ServiceNow"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/service_desk"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.ai.agentserver.*", "microsoft_agents.*", "copilot.*"]
ignore_missing_imports = true
